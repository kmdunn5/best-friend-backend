spring:
  application:
    name: Best Friends API
  datasource:
    url: jdbc:postgresql://localhost:5432/bestfriends
    username: bestfriends
    password: bestfriends
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    mapper:
      require-handlers-for-java8-times: false
  flyway:
    locations: classpath:db/migration

bestfriends:
  admin-secret: local-dev-secret

logging:
  level:
    root: WARN
    org:
      bestfriends: DEBUG
