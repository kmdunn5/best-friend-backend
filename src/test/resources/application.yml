spring:
  application:
    name: Best Friends API
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  jackson:
    mapper:
      require-handlers-for-java8-times: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never

bestfriends:
  admin-secret: test-secret

logging:
  level:
    root: WARN
    org:
      bestfriends: DEBUG
